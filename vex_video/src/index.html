<body style="margin:0;background:#000"><canvas id="c"></canvas>
<script>
const W=1080,H=1920,CX=540,CY=960;

let ctx=cv.getContext('2d');const MAIN=ctx;
const IM={};
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const P=(t,a,b)=>clamp((t-a)/(b-a));
const eo3=x=>1-(1-x)**3,eio3=x=>x<.5?4*x**3:1-(-2*x+2)**3/2,eoE=x=>x>=1?1:1-2**(-10*x),eiE=x=>x<=0?0:2**(10*x-10);
const eoB=x=>{const c1=1.70158,c3=c1+1;return 1+c3*(x-1)**3+c1*(x-1)**2};
const eoEl=x=>x<=0?0:x>=1?1:2**(-10*x)*Math.sin((x*10-.75)*2*Math.PI/3)+1;

 if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=sw;ctx.lineJoin='round';ctx.strokeText(s,x,y)}

function bgGrad(c0='#012e3c',c1='#00141c'){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,c0);g.addColorStop(1,c1);ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
function rad(x,y,r,c0,c1='rgba(0,0,0,0)'){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,c0);g.addColorStop(1,c1);ctx.fillStyle=g;ctx.fillRect(x-r,y-r,2*r,2*r)}
function img(n,x,y,w,rot=0,al=1,h){const i=IM[n];h=h||w*i.height/i.width;ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.globalAlpha*=al;ctx.drawImage(i,-w/2,-h/2,w,h);ctx.restore()}

const ECG=[[0,0],[.1,0],[.15,-8],[.2,0],[.3,0],[.33,10],[.37,-78],[.41,40],[.45,0],[.6,0],[.68,-14],[.76,0],[1,0]];
function ecgY(p){p=((p%1)+1)%1;for(let i=1;i<ECG.length;i++){if(p<=ECG[i][0]){const a=ECG[i-1],b=ECG[i];return lerp(a[1],b[1],(p-a[0])/(b[0]-a[0]))}}return 0}

 ctx.drawImage(IM.black,0,0,3072,4,x,y-E,s,E);let g1=ctx.createLinearGradient(0,y-E,0,y);g1.addColorStop(0,'#00101a');g1.addColorStop(.55,'rgba(1,37,53,.97)');g1.addColorStop(1,'rgba(1,37,53,0)');ctx.fillStyle=g1;ctx.fillRect(x-2,y-E,s+4,E);
 ctx.drawImage(IM.black,0,3068,3072,4,x,y+s,s,E);let g2=ctx.createLinearGradient(0,y+s,0,y+s+E);g2.addColorStop(0,'rgba(0,19,27,0)');g2.addColorStop(.5,'rgba(0,16,23,.97)');g2.addColorStop(1,'#00080d');ctx.fillStyle=g2;ctx.fillRect(x-2,y+s,s+4,E);

 ctx.strokeStyle=col;ctx.lineWidth=4;glow(col,10);ecgPath(w/2-250,w/2-30,h/2-80,.5,220,spark,1);ctx.stroke();noglow();ctx.restore()}

/* ---------------- S2 DOODLE BOIL ---------------- */
function wob(pts,seed,fr,amp){return pts.map((p,i)=>[p[0]+(hs(seed+i*3.1+fr*17.7)-.5)*amp,p[1]+(hs(seed+i*5.3+fr*9.1+7)-.5)*amp])}
function ink(pts,col,w,prog=1,seed=1,fr=0,amp=7){const q=wob(pts,seed,fr,amp);const n=Math.max(2,Math.floor(q.length*prog));ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();for(let i=0;i<n;i++)i?ctx.lineTo(q[i][0],q[i][1]):ctx.moveTo(q[i][0],q[i][1]);ctx.stroke()}
const ell=(cx,cy,rx,ry,n=36,a0=-1.2,a1=a0+Math.PI*2.1)=>Array.from({length:n+1},(_,i)=>{const a=lerp(a0,a1,i/n);return[cx+rx*Math.cos(a),cy+ry*Math.sin(a)]});
function s2(u,lt,t){const fr=Math.floor(t*12);ctx.fillStyle='#052431';ctx.fillRect(0,0,W,H);ctx.strokeStyle='rgba(255,255,255,.06)';ctx.lineWidth=2;
 for(let x=60;x<W;x+=90){ctx.beginPath();ctx.moveTo(x+Math.sin(fr+x)*2,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=60;y<H;y+=90){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y+Math.sin(fr+y)*2);ctx.stroke()}
 const A=(a,b)=>eo3(P(u,a,b));
 // band loop
 ink(ell(540,880,330,430),CYN,10,A(0,.35),1,fr);ink(ell(540,880,255,350,36,-1.1),CYN,8,A(.08,.4),2,fr);
 for(let i=0;i<16;i++){const y=560+i*40;ink([[300+Math.sin(i)*10,y],[400,y-26],[470,y+12]],OR,6,A(.12+i*.01,.45),10+i,fr,5)}
 ink([[250,1040],[250,1230],[640,1230],[640,1040],[250,1040]],'#fff',9,A(.3,.55),20,fr,6);
 ink([[340,1070],[410,1190],[470,1070]],'#fff',9,A(.45,.6),21,fr,4);ink([[500,1070],[610,1195]],'#fff',9,A(.5,.62),22,fr,4);ink([[610,1070],[500,1195]],'#fff',9,A(.52,.64),23,fr,4);
 // heart
 const hp=Array.from({length:41},(_,i)=>{const a=i/40*Math.PI*2;return[800+10.5*16*Math.sin(a)**3,420-10.5*(13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a))]});
 ink(hp,OR,10,A(.2,.55),30,fr);
 // ecg
 ctx.save();glow(CYN,0);ctx.strokeStyle='#fff';ctx.lineWidth=9;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();const pr=A(.25,.9);for(let x=40;x<=lerp(40,1040,pr);x+=6){const yy=1500+ecgY((x-40)/330)*1.3+(hs(x+fr*7)-.5)*6;x===40?ctx.moveTo(x,yy):ctx.lineTo(x,yy)}ctx.stroke();ctx.restore();
 // sparkles + arrows + marks
 const sp=[[130,300],[950,760],[140,1500],[930,1650],[820,1000]];sp.forEach(([x,y],i)=>{const a=A(.4+i*.05,.7+i*.04);const r=40*a;ink([[x,y-r],[x,y+r]],'#fff',7,1,40+i,fr,4);ink([[x-r,y],[x+r,y]],'#fff',7,1,50+i,fr,4);ink([[x-r*.6,y-r*.6],[x+r*.6,y+r*.6]],OR,6,1,60+i,fr,4)});
 ink([[870,640],[780,820],[760,790],[770,830],[800,830]],OR,9,A(.55,.8),70,fr,5);
 ink([[100,780],[180,700],[170,740],[190,690],[145,690]],CYN,9,A(.5,.75),71,fr,5);
 for(let i=0;i<3;i++)ink([[880+i*30,230],[890+i*30,290]],'#fff',9,A(.6,.85),80+i,fr,4);
 ctx.fillStyle='#ff4a1c';ctx.beginPath();ctx.arc(900,300,10,0,7);ctx.fill()}

/* ---------------- S3 HEADLINE WALL ---------------- */
const WALL=['VEX BAND  •  ','HEART  •  ','SLEEP  •  ','STRESS  •  ','SpO₂  •  ','VEX BAND  •  ','STEPS  •  ','LIVE  •  ','HRV  •  ','VEX BAND  •  ','BEAT  •  ','FEEL IT  •  ','VEX BAND  •  ','HEART  •  '];

 const rh=165,n=WALL.length,hi=Math.floor(u*8)%n;

  const bright=(i===hi);for(let k=-2;k<Math.ceil(W*2/w)+3;k++){const x=k*w-off-400;

   else if(st===2)T(WALL[i],x,y+130,150,OR,{al:'left'});
   else T(WALL[i],x,y+130,150,'rgba(0,236,255,.35)',{al:'left'})}}
 ctx.restore();rad(CX,CY,1100,'rgba(0,0,0,0)','rgba(0,8,12,.65)')}

 ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(CX-60,CY);ctx.lineTo(CX-18,CY);ctx.moveTo(CX+18,CY);ctx.lineTo(CX+60,CY);ctx.moveTo(CX,CY-60);ctx.lineTo(CX,CY-18);ctx.moveTo(CX,CY+18);ctx.lineTo(CX,CY+60);ctx.stroke();

 ctx.fillStyle='rgba(255,255,255,.25)';ctx.fillRect(140,1800,800,8);ctx.fillStyle=CYN;ctx.fillRect(140,1800,800*e,8);
 for(let i=0;i<=10;i++){ctx.fillStyle='rgba(255,255,255,.6)';ctx.fillRect(140+i*80-1,1790,3,28)}
 ctx.fillStyle='rgba(0,0,0,.18)';for(let y=0;y<H;y+=6)ctx.fillRect(0,y,W,2)}

function s5(u,lt,t){withCtx(GB.getContext('2d'),()=>{bgGrad('#2a0b2e','#041c2c');rad(220,500,700,'rgba(255,74,28,.85)');rad(900,1300,800,'rgba(0,236,255,.75)');rad(300,1500,600,'rgba(120,60,255,.6)');

 const gl=GL.getContext('2d');gl.clearRect(0,0,W,H);gl.filter='blur(34px) saturate(1.3) brightness(1.25)';gl.drawImage(GB,0,0);gl.filter='none';gl.fillStyle='rgba(255,255,255,.2)';gl.fillRect(0,0,W,H);

/* ---------------- S6 ORBIT ---------------- */
const ORB=[['HEART','72 BPM',OR],['SpO₂','98 %',CYN],['SLEEP','7h 42m','#9a7bff'],['STRESS','LOW','#3dff9a'],['TEMP','36.5°','#ffd23a'],['STEPS','8,420','#ff7ad9']];
function s6(u,lt,t){const e=eio3(u);drawHero(lerp(1.0,1.18,e),.5,.47,0,-20,lerp(.02,-.02,u));

 const draw=front=>{ctx.save();ctx.strokeStyle=front?'rgba(0,236,255,.9)':'rgba(0,236,255,.28)';ctx.lineWidth=front?4:3;glow(CYN,front?16:0);ctx.beginPath();let on=false;for(let a=0;a<=Math.PI*2+.05;a+=.05){const[x,y,d]=orbitPt(a);if((d>0)===front){on?ctx.lineTo(x,y):ctx.moveTo(x,y);on=true}else on=false}ctx.stroke();ctx.restore();
  ORB.forEach((o,i)=>{const[x,y,d]=orbitPt(ang+i*Math.PI/3);if((d>0)!==front)return;const s=lerp(.7,1.08,(d+1)/2);const pop=eoB(P(u,i*.04,.3+i*.04));chip(x,y,330,92,o[0],o[1],o[2],front?1:.55,s*pop)})};

 const fl=P(u,0,.15);if(fl<1){rad(cx,cy,900*eo3(fl),'rgba(0,236,255,'+(.5*(1-fl))+')')}
