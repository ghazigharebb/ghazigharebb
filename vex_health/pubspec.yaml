name: vex_health
description: VEX Health — Kurdish health app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10
  image_picker: ^1.1.2
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1
  qr_flutter: ^4.1.0
  http: ^1.2.2
  permission_handler: ^11.3.1
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  geolocator: ^12.0.0
  geocoding: ^3.0.0
  flutter_blue_plus: ^1.32.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/ads/
    - assets/brand/
    - assets/data/
    - assets/foods/
    - assets/pay/
    - assets/chars/
  fonts:
    - family: NotoAr
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
        - asset: assets/fonts/NotoSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansArabic-Bold.ttf
          weight: 700

# ڕەنگی شاشەی سەرەتای سیستەم (پێش ئەوەی Flutter دەست پێبکات)
# بۆ چالاککردن: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#041A22"
  android_12:
    color: "#041A22"
