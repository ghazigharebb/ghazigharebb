<!doctype html>
<html lang="ckb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wasta Ghareb 3D Pro</title>
<style>
@font-face{font-family:"WG Anton";src:url(../fonts/Anton.ttf) format("truetype"),url(https://fonts.gstatic.com/s/anton/v27/1Ptgg87LROyAm0K0.ttf) format("truetype")}
@font-face{font-family:"WG Kufi";font-weight:900;src:url(../fonts/NotoKufiArabic-Black.ttf) format("truetype"),url(https://fonts.gstatic.com/s/notokufiarabic/v27/CSRp4ydQnPyaDxEXLFF6LZVLKrodhu8t57o1kDc5Wh7G2IbP.ttf) format("truetype")}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
canvas{display:block;width:100vw;height:auto;max-height:100vh;aspect-ratio:720/200}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* WASTA GHAREB — LED ad, 720x200 logical, 20 s seamless loop, renders at any scale (?scale=5.3333 -> 3840x1066)
   S1 0.0-4.5   Brand: 3D "WASTA GHAREB" letters fly in from depth + "وەستا غەریب"
   S2 4.5-10    ANKER POWER BANK — 3D carousel of 5 power banks, silhouette teaser -> reveal, "لەم نزیکانە / COMING SOON"
   S3 10-15.5   ADAPTER & CABLE — products fly in, electric arcs, green "بەردەستە / IN STOCK"
   S4 15.5-20   Opening hours only — day->night time-lapse sky, clock 9 -> 11, city lights, "9 AM – 11 PM"
   The portrait logo lives in the left panel through every scene.                                                  */
const TXT={brand:"WASTA GHAREB",brandKu:"وەستا غەریب",anker:"ANKER",pb:"POWER BANK",soonKu:"لەم نزیکانە",soonEn:"COMING SOON",
  ad1:"ADAPTER",ad2:"& CABLE",stockKu:"بەردەستە",stockEn:"IN STOCK",hoursKu:"کاتی کردنەوە",h1:"9 AM",h2:"11 PM",hoursLine:"لە ٩ی بەیانی تا ١١ی شەو"};
const Q=new URLSearchParams(location.search), CAP=Q.has("capture");
const W=720,H=200,DUR=20,S=+Q.get("scale")||2;
const CW=Math.round(W*S),CH=2*Math.round(H*S/2),SX=CW/W,SY=CH/H;
const C=document.getElementById("c");C.width=CW;C.height=CH;const ctx=C.getContext("2d");
const base=g=>g.setTransform(SX,0,0,SY,0,0);
const TAU=Math.PI*2,AN='"WG Anton", Impact, sans-serif',KU='"WG Kufi", Tahoma, sans-serif';
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),lerp=(a,b,x)=>a+(b-a)*x,prog=(t,a,b)=>clamp((t-a)/(b-a)),frac=x=>x-Math.floor(x);
const oCub=x=>1-Math.pow(1-x,3),ioCub=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,oExpo=x=>x>=1?1:1-Math.pow(2,-10*x);
const oBack=(x,s=1.7)=>1+(s+1)*Math.pow(x-1,3)+s*Math.pow(x-1,2),bump=(t,a,b)=>Math.sin(prog(t,a,b)*Math.PI);
function rng(s){s=s>>>0||1;return()=>(s=(s*1664525+1013904223)>>>0)/4294967296}
function cv(w,h){const c=document.createElement("canvas");c.width=w;c.height=h;return c}
const LA=cv(CW,CH),LB=cv(CW,CH);
function clr(c){const g=c.getContext("2d");g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,CW,CH);base(g);g.globalAlpha=1;g.globalCompositeOperation="source-over";g.shadowBlur=0;return g}
const rgba=(c,a)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`,mix=(a,b,x)=>a.map((v,i)=>lerp(v,b[i],x));
const ACC=[[47,123,255],[20,200,255],[255,184,31],[155,107,255]];
let A=ACC[0];

/* ---------- assets ---------- */
const NAMES=["logo","pb_anker20k","pb_maggo_stand","pb_qi2_blue","pb_anker165","pb_instacord","adapter","cable_coil","cable_closeup","magsafe"];
const IMG={},REF={},SIL={};
function prep(n,i){
  IMG[n]=i;const w=i.width,h=i.height,rh=Math.round(h*.5);
  const r=cv(w,rh),g=r.getContext("2d");g.translate(0,h);g.scale(1,-1);g.drawImage(i,0,0);g.setTransform(1,0,0,1,0,0);
  g.globalCompositeOperation="destination-out";const gr=g.createLinearGradient(0,0,0,rh);gr.addColorStop(0,"rgba(0,0,0,.5)");gr.addColorStop(1,"#000");
  g.fillStyle=gr;g.fillRect(0,0,w,rh);REF[n]=r;
  const s=cv(w,h),q=s.getContext("2d");q.drawImage(i,0,0);q.globalCompositeOperation="source-atop";q.fillStyle="#02060f";q.fillRect(0,0,w,h);SIL[n]=s;
}
function prod(g,n,cx,fy,bh,bw,o={}){
  const i=IMG[n],h=Math.min(bh,bw*i.height/i.width),w=h*i.width/i.height,a=o.a??1,bob=o.bob||0;
  if(a<=0||h<1)return;g.save();g.globalAlpha=a;
  if(o.glow){const gr=g.createRadialGradient(cx,fy-h*.55,0,cx,fy-h*.55,h*.8);gr.addColorStop(0,o.glow);gr.addColorStop(1,"rgba(0,0,0,0)");g.fillStyle=gr;g.fillRect(cx-h,fy-h*1.4,2*h,h*1.7)}
  g.fillStyle="rgba(0,0,0,.5)";g.beginPath();g.ellipse(cx,fy+1,w*.44*(1-bob/30),Math.max(1,h*.045),0,0,TAU);g.fill();
  g.globalAlpha=a*.3*(1-(o.sil||0)*.7);g.drawImage(REF[n],cx-w/2,fy+bob,w,h*.5);g.globalAlpha=a;
  g.translate(cx,fy-bob-h/2);g.rotate(o.rot||0);g.scale(o.sq||1,1);
  g.drawImage(i,-w/2,-h/2,w,h);
  if(o.sil>0){g.globalAlpha=a*clamp(o.sil);if(o.rim){g.shadowColor=o.rim;g.shadowBlur=9*S}g.drawImage(SIL[n],-w/2,-h/2,w,h);g.shadowBlur=0}
  g.restore();
}

/* ---------- type ---------- */
let M={};
function fit(text,font,maxW,maxH,dir,wt){ctx.direction=dir||"ltr";wt=wt||"";
  for(let s=200;s>6;s-=.5){const f=wt+s+"px "+font;ctx.font=f;const m=ctx.measureText(text),h=m.actualBoundingBoxAscent+m.actualBoundingBoxDescent;
    if(m.width<=maxW&&h<=maxH)return{f,a:m.actualBoundingBoxAscent,d:m.actualBoundingBoxDescent,w:m.width}}}
const by=(m,cy)=>cy+(m.a-m.d)/2;
function chars(m,s){ctx.font=m.f;ctx.direction="ltr";return[...s].map(c=>ctx.measureText(c).width)}
function setup(){
  M.brand=fit(TXT.brand,AN,470,84);M.brandC=chars(M.brand,TXT.brand);M.brandKu=fit(TXT.brandKu,KU,300,52,"rtl","900 ");
  M.anker=fit(TXT.anker,AN,226,62);M.ankerC=chars(M.anker,TXT.anker);M.pb=fit(TXT.pb,AN,226,27);
  M.soonKu=fit(TXT.soonKu,KU,196,38,"rtl","900 ");M.soonEn=fit(TXT.soonEn,AN,196,32);
  M.ad1=fit(TXT.ad1,AN,178,42);M.ad2=fit(TXT.ad2,AN,178,42);M.stockKu=fit(TXT.stockKu,KU,124,36,"rtl","900 ");M.stockEn=fit(TXT.stockEn,AN,124,30);
  M.hoursKu=fit(TXT.hoursKu,KU,280,34,"rtl","900 ");M.h1=fit(TXT.h1,AN,130,60);M.h2=fit(TXT.h2,AN,130,60);
  const hh=Math.min(M.h1.a+M.h1.d,M.h2.a+M.h2.d);M.h1=fit(TXT.h1,AN,130,hh+.1);M.h2=fit(TXT.h2,AN,130,hh+.1);
  M.hoursLine=fit(TXT.hoursLine,KU,400,31,"rtl","900 ");
}
function ext(g,m,s,x,y,o){ // extruded 3D text
  g.font=m.f;g.direction=o.dir||"ltr";g.textAlign=o.al||"center";g.textBaseline="alphabetic";const D=o.depth??7;
  for(let d=D;d>=1;d--){g.fillStyle=d>D*.45?o.s2:o.s1;g.fillText(s,x+d*.5,y+d*.7)}
  if(o.glow){g.shadowColor=o.glow;g.shadowBlur=(o.gb||12)*S}
  g.fillStyle=o.face;g.fillText(s,x,y);g.shadowBlur=0;
  if(o.hl){g.lineWidth=.8;g.strokeStyle=o.hl;g.strokeText(s,x,y)}
}
const vgrad=(g,y0,y1,stops)=>{const gr=g.createLinearGradient(0,y0,0,y1);stops.forEach((c,i)=>gr.addColorStop(i/(stops.length-1),c));return gr};
function glint(c,p,a=.85,w=55){if(p<=0||p>=1)return;const g=c.getContext("2d");g.save();g.globalCompositeOperation="source-atop";
  g.translate(lerp(-160,W+160,p),H/2);g.transform(1,0,-.45,1,0,0);const gr=g.createLinearGradient(-w,0,w,0);
  gr.addColorStop(0,"rgba(255,255,255,0)");gr.addColorStop(.5,`rgba(255,255,255,${a})`);gr.addColorStop(1,"rgba(255,255,255,0)");g.fillStyle=gr;g.fillRect(-w,-H,2*w,2*H);g.restore()}
function pill(g,cx,cy,w,h,c1,c2,glow){g.save();g.beginPath();g.roundRect(cx-w/2,cy-h/2,w,h,h/2);g.fillStyle=vgrad(g,cy-h/2,cy+h/2,[c1,c2]);
  if(glow){g.shadowColor=glow;g.shadowBlur=16*S}g.fill();g.shadowBlur=0;g.lineWidth=1.4;g.strokeStyle="rgba(255,255,255,.55)";g.stroke();
  g.beginPath();g.roundRect(cx-w/2+4,cy-h/2+3,w-8,h*.38,h*.2);g.fillStyle="rgba(255,255,255,.18)";g.fill();g.restore()}
function flipY(g,cy,sy,fn){if(sy<=.001)return;g.save();g.translate(0,cy);g.scale(1,sy);g.translate(0,-cy);fn();g.restore()}
function star(g,x,y,r,rot=0){g.beginPath();for(let i=0;i<10;i++){const a=rot-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;g.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}g.closePath();g.fill()}
function sparkle(g,x,y,r,a){if(a<=0)return;g.save();g.globalCompositeOperation="lighter";g.fillStyle=`rgba(255,255,255,${a})`;
  g.beginPath();g.moveTo(x,y-r);g.lineTo(x+r*.16,y);g.lineTo(x,y+r);g.lineTo(x-r*.16,y);g.fill();g.beginPath();g.moveTo(x-r,y);g.lineTo(x,y+r*.16);g.lineTo(x+r,y);g.lineTo(x,y-r*.16);g.fill();g.restore()}
function burst(g,x,y,d,seed,col,R0=1){if(d<0||d>.8)return;g.save();g.globalCompositeOperation="lighter";const p=prog(d,0,.5);
  if(p<1){g.strokeStyle=rgba(col,1-p);g.lineWidth=lerp(7,.5,p);g.beginPath();g.ellipse(x,y,lerp(10,190*R0,oCub(p)),lerp(4,60*R0,oCub(p)),0,0,TAU);g.stroke()}
  const R=rng(seed);for(let i=0;i<26;i++){const a=R()*TAU,v=(150+R()*330)*R0,dd=v*(1-Math.exp(-4*d))/4,al=1-d/.8,px=x+Math.cos(a)*dd,py=y+Math.sin(a)*dd*.55;
    g.strokeStyle=i%3?rgba(col,al):`rgba(255,255,255,${al})`;g.lineWidth=1.5;g.beginPath();g.moveTo(px,py);g.lineTo(px-Math.cos(a)*12*al,py-Math.sin(a)*7*al);g.stroke()}
  g.restore()}
function bolt(g,x1,y1,x2,y2,seed,a){if(a<=0)return;const R=rng(seed),P=[],n=11,nx=-(y2-y1),ny=x2-x1,l=Math.hypot(nx,ny);
  for(let k=0;k<=n;k++){const u=k/n,j=(k&&k<n)?(R()-.5)*16:0;P.push([lerp(x1,x2,u)+nx/l*j,lerp(y1,y2,u)+ny/l*j])}
  g.save();g.globalCompositeOperation="lighter";g.lineJoin="round";
  for(const[lw,c]of[[6,`rgba(255,180,40,${.22*a})`],[2.4,`rgba(255,225,140,${.6*a})`],[1,`rgba(255,255,255,${a})`]]){g.lineWidth=lw;g.strokeStyle=c;g.beginPath();P.forEach((p,k)=>k?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.stroke()}
  g.restore()}

/* ---------- shared stage ---------- */
const HY=124,VX=458;
function bg(g,t){
  g.fillStyle=vgrad(g,0,H,["#020611","#06102e","#081639","#030714"]);g.fillRect(0,0,W,H);
  let gr=g.createRadialGradient(VX,HY,0,VX,HY,340);gr.addColorStop(0,rgba(A,.38));gr.addColorStop(1,rgba(A,0));g.fillStyle=gr;g.fillRect(0,0,W,H);
  g.save();g.globalCompositeOperation="lighter";
  for(const[x0,ph]of[[300,0],[620,Math.PI]]){const ang=Math.sin(TAU*t/10+ph)*.32,bx=x0+Math.tan(ang)*210;
    g.fillStyle=vgrad(g,0,H,[rgba(A,.2),rgba(A,0)]);g.beginPath();g.moveTo(x0-6,-5);g.lineTo(x0+6,-5);g.lineTo(bx+80,H);g.lineTo(bx-80,H);g.closePath();g.fill()}
  g.strokeStyle=rgba(A,1);g.lineWidth=.6;
  for(let i=0;i<10;i++){const u=frac(i/10+t*.5),y=HY+(H-HY)*Math.pow(u,2.1);g.globalAlpha=u*.42;g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}
  g.globalAlpha=.22;for(let k=-14;k<=14;k++){g.beginPath();g.moveTo(VX+k*9,HY);g.lineTo(VX+k*92,H);g.stroke()}
  g.globalAlpha=1;gr=g.createLinearGradient(0,0,W,0);gr.addColorStop(0,rgba(A,0));gr.addColorStop(.62,rgba(A,.75));gr.addColorStop(1,rgba(A,0));g.fillStyle=gr;g.fillRect(0,HY-.5,W,1);
  const R=rng(5);for(let i=0;i<34;i++){const x0=R(),k=1+Math.floor(R()*3),y0=R()*H*.8,r=.8+R()*2.6,ph=R()*TAU,
    x=frac(x0+t*k/20)*(W+40)-20,y=y0+Math.sin(TAU*t/10+ph)*7,al=(.1+.22*(.5+.5*Math.sin(TAU*t/4+ph)));
    g.fillStyle=rgba(i%4?A:[255,255,255],al);g.beginPath();g.arc(x,y,r,0,TAU);g.fill()}
  g.restore();
}
function logoPanel(g,t,gl){
  const E=198;g.save();g.beginPath();g.moveTo(0,0);g.lineTo(E+12,0);g.lineTo(E-12,H);g.lineTo(0,H);g.closePath();
  g.fillStyle=vgrad(g,0,H,["#05102f","#0a1d55","#040a22"]);g.fill();g.save();g.clip();
  g.save();g.translate(96,78);g.rotate(TAU*t/20);g.globalCompositeOperation="lighter";
  for(let i=0;i<14;i++){g.rotate(TAU/14);g.beginPath();g.moveTo(0,0);g.lineTo(260,-26);g.lineTo(260,26);g.closePath();g.fillStyle=rgba(A,.08);g.fill()}g.restore();
  let gr=g.createRadialGradient(96,84,0,96,84,120);gr.addColorStop(0,rgba(A,.55));gr.addColorStop(1,rgba(A,0));g.fillStyle=gr;g.fillRect(0,0,E+12,H);
  const lg=IMG.logo,lh=191*(1+.012*Math.sin(TAU*t/4)),lw=lh*lg.width/lg.height,lx=96-lw/2,ly=198-lh;
  if(gl>0&&gl<1){const l=clr(LA);l.drawImage(lg,lx,ly,lw,lh);glint(LA,gl,.9,40);g.drawImage(LA,0,0,W,H)}else g.drawImage(lg,lx,ly,lw,lh);
  [[321,890],[403,890],[489,890],[571,890],[656,890]].forEach(([sx,sy],i)=>sparkle(g,lx+sx*lw/lg.width,ly+sy*lh/lg.height,7,bump(frac(t/2.5-i*.13),0,.25)*.95));
  g.restore();g.shadowColor=rgba(A,1);g.shadowBlur=10*S;g.strokeStyle=rgba(mix(A,[255,255,255],.5),1);g.lineWidth=2.2;
  g.beginPath();g.moveTo(E+12,0);g.lineTo(E-12,H);g.stroke();g.shadowBlur=0;g.restore();
}

/* ---------- S1 brand ---------- */
/* Blender pop-out frames (rendered by blender/s1_popout.py): 153 frames @30fps covering local time -0.25..4.83 s */
const S1N=153,S1X=186,S1W=534;let S1IMG=null,S1IDX=-1,S1V=null;
const s1i=u=>clamp(Math.round((u+.25)*30),0,S1N-1);
function s1u(t){t=((t%DUR)+DUR)%DUR;return t<4.86?t:t>=19.74?t-DUR:null}
window.prepFrame=async t=>{const u=s1u(t);if(u===null)return;const i=s1i(u);if(i===S1IDX)return;
  const im=new Image();im.src="blender_s1/s1_"+String(i).padStart(4,"0")+".png";try{await im.decode();S1IMG=im;S1IDX=i}catch(e){S1IMG=null;S1IDX=-1}};
function sc1(g,u){
  if(CAP&&S1IMG&&S1IDX===s1i(u)){g.drawImage(S1IMG,S1X,0,S1W,H);return}
  if(!CAP&&S1V&&S1V.readyState>=2){const want=(u+.25);if(Math.abs(S1V.currentTime-want)>.12)S1V.currentTime=want;if(S1V.paused)S1V.play().catch(()=>{});g.drawImage(S1V,S1X,0,S1W,H);return}
  sc1_2d(g,u);
}
function sc1_2d(g,u){
  const m=M.brand,l=clr(LA),yb=by(m,74);let x=458-m.w/2;
  const face=vgrad(l,yb-m.a,yb,["#ffffff","#dce8ff","#9fbfff"]);
  [...TXT.brand].forEach((ch,i)=>{const w=M.brandC[i];if(ch!==" "){const q=prog(u,.12+i*.045,.62+i*.045);
    if(q>0){const s=lerp(3.4,1,oExpo(q)),cx=x+w/2,cy=yb-m.a/2;l.save();l.globalAlpha=clamp(q*2.5);l.translate(cx,cy);l.scale(s,s);l.translate(-cx,-cy);
      ext(l,m,ch,x,yb,{al:"left",face,s1:"#123a9c",s2:"#050f33",depth:8,glow:rgba(A,.9),gb:14});l.restore()}}x+=w});
  glint(LA,prog(u,1.75,2.45));glint(LA,prog(u,3.55,4.2),.6);g.drawImage(LA,0,0,W,H);
  const k=M.brandKu,p=oCub(prog(u,.95,1.55)),kx=458+k.w/2+3,kw=(k.w+6)*p;
  g.save();g.beginPath();g.rect(kx-kw,110,kw,90);g.clip();
  ext(g,k,TXT.brandKu,458,by(k,152),{dir:"rtl",face:vgrad(g,124,180,["#fff3bf","#ffc83d","#ff9415"]),s1:"#a85a00",s2:"#4a2200",depth:5,glow:"rgba(255,150,30,.7)"});g.restore();
  g.fillStyle="#ffc83d";const sw=oBack(prog(u,1.4,1.8),2);
  for(const sgn of[-1,1])for(let j=0;j<3;j++){const q=oBack(prog(u,1.45+j*.08,1.8+j*.08),2.4);if(q>0)star(g,458+sgn*(k.w/2+22+j*17),150,(j===0?7:5.5)*q,TAU*u*.1*sgn)}
  if(sw>0){g.save();g.globalCompositeOperation="lighter";const f=bump(u,.95,1.7);const gr=g.createLinearGradient(200,0,720,0);
    gr.addColorStop(0,"rgba(255,255,255,0)");gr.addColorStop(.5,`rgba(220,235,255,${.7*f})`);gr.addColorStop(1,"rgba(255,255,255,0)");g.fillStyle=gr;g.fillRect(200,73,520,1.6);g.restore()}
}
/* ---------- S2 Anker coming soon ---------- */
const PB=["pb_anker165","pb_maggo_stand","pb_anker20k","pb_qi2_blue","pb_instacord"];
function sc2(g,u){
  const cx=338,fy=178,rx=104,rise=oCub(prog(u,0,.6)),yo=(1-rise)*70,sil=1-ioCub(prog(u,.7,1.5));
  g.save();g.translate(0,yo);
  let gr=g.createRadialGradient(cx,fy+3,0,cx,fy+3,160);gr.addColorStop(0,rgba(A,.35));gr.addColorStop(1,rgba(A,0));g.fillStyle=gr;g.beginPath();g.ellipse(cx,fy+3,160,18,0,0,TAU);g.fill();
  g.shadowColor=rgba(A,1);g.shadowBlur=10*S;g.strokeStyle=rgba(mix(A,[255,255,255],.4),.9);g.lineWidth=1.6;g.beginPath();g.ellipse(cx,fy+3,150,15,0,0,TAU);g.stroke();g.shadowBlur=0;
  const da=TAU*u/2.75;sparkle(g,cx+Math.cos(da)*150,fy+3+Math.sin(da)*15,9,.9);
  let st=0;for(let k=0;k<5;k++)st+=ioCub(prog(u,1.3+k*.84,1.78+k*.84));const b0=-st*TAU/5;
  PB.map((n,i)=>{const th=b0+i*TAU/5,z=Math.cos(th);return{n,i,x:cx+Math.sin(th)*rx,z,d:(z+1)/2}}).sort((a,b)=>a.z-b.z).forEach(it=>{
    const s=.4+.6*it.d;prod(g,it.n,it.x,fy-(1-it.d)*22,172*s,132*s,{bob:2.5+2.5*Math.sin(TAU*u/2.75+it.i),sil:Math.max(sil,(1-it.d)*.5),rim:rgba(A,.9),glow:it.d>.85?rgba(A,.45*(it.d-.85)/.15):null})});
  g.restore();
  // text
  const tx=592,m=M.anker;let x=tx-m.w/2;const yb=by(m,42),face=vgrad(g,yb-m.a,yb,["#ffffff","#bff0ff"]);

/* ---------- S3 adapter & cable ---------- */

  let gr=g.createRadialGradient(cx,fy+3,0,cx,fy+3,150);gr.addColorStop(0,rgba(A,.35));gr.addColorStop(1,rgba(A,0));g.fillStyle=gr;g.beginPath();g.ellipse(cx,fy+3,150,18,0,0,TAU);g.fill();

    g.strokeStyle="#08a85a";g.lineWidth=4.5;g.lineCap="round";g.lineJoin="round";const cp=oCub(prog(u,1.25,1.6));

/* ---------- S4 opening hours ---------- */

function sc4(g,u){
  const n=ioCub(prog(u,1.7,3.1)),sk=[0,1,2].map(i=>mix(SKY_D[i],SKY_N[i],n));
  g.fillStyle=vgrad(g,0,H,[rgba(sk[0],1),rgba(sk[1],1),rgba(sk[2],1)]);g.fillRect(0,0,W,H);
  const R=rng(21);for(let i=0;i<60;i++){const x=200+R()*520,y=R()*130,tw=.5+.5*Math.sin(TAU*u*1.6+i);g.fillStyle=`rgba(255,255,255,${n*(.25+.6*tw)*R()})`;g.fillRect(x,y,1.3,1.3)}
  const sy=lerp(215,96,oCub(prog(u,.05,.85)))+ioCub(prog(u,1.5,2.6))*130,sx=248;

    g.restore();g.fillStyle=vgrad(g,sy-22,sy+22,["#fff6c8","#ffc83d","#ff8a1a"]);g.beginPath();g.arc(sx,sy,21,0,TAU);g.fill()}
  const mx=680,my=lerp(225,58,oCub(prog(u,2.15,3.0)));if(my<220){g.save();let gr=g.createRadialGradient(mx,my,0,mx,my,60);gr.addColorStop(0,"rgba(200,210,255,.45)");gr.addColorStop(1,"rgba(150,160,255,0)");
    g.fillStyle=gr;g.fillRect(mx-60,my-60,120,120);g.fillStyle="#eef1ff";g.beginPath();g.arc(mx,my,18,0,TAU);g.fill();
    g.fillStyle=rgba(mix(sk[0],sk[1],my/H),1);g.beginPath();g.arc(mx+9,my-6,16,0,TAU);g.fill();g.restore()}

  const RB=rng(77);let bx=196;g.fillStyle="#040817";const blds=[];while(bx<730){const w=14+RB()*26,h=16+RB()*30;blds.push([bx,w,h]);bx+=w+1}
  for(const[x,w,h]of blds){g.fillStyle="#040817";g.fillRect(x,H-h,w,h);for(let wy=H-h+4;wy<H-3;wy+=6)for(let wx=x+3;wx<x+w-3;wx+=5)if(RB()<.55){

  flipY(g,100,e(1),()=>ext(g,M.h1,TXT.h1,350,hb,ho));flipY(g,100,e(2),()=>ext(g,M.h2,TXT.h2,570,by(M.h2,100),ho));
  const cs=oBack(prog(u,.4,.8),2);if(cs>0){g.save();g.translate(tx,100);g.scale(cs,cs);
    g.fillStyle="rgba(5,10,40,.75)";g.beginPath();g.arc(0,0,27,0,TAU);g.fill();g.shadowColor="#ffc83d";g.shadowBlur=8*S;g.strokeStyle="#ffc83d";g.lineWidth=3;g.stroke();g.shadowBlur=0;
    g.fillStyle="#fff";for(let i=0;i<12;i++){const a=i*TAU/12;g.fillRect(Math.cos(a)*21-1,Math.sin(a)*21-1,2,2)}
    const hp=ioCub(prog(u,.7,3.5)),hr=9+14*hp,ha=hr/12*TAU-Math.PI/2,ma=hr*TAU-Math.PI/2;g.lineCap="round";

/* ---------- master ---------- */
const B=[0,4.5,10,15.5],LEN=[4.5,5.5,5.5,4.5];
/* photoreal Blender frames per scene (blender/pro3d.py): scene n frame i <-> local time u=i/30-0.25; the 2D code stays as fallback */
const SN=[153,183,183,153],CACHE={},SC2D=[sc1_2d,sc2,sc3,sc4];
const fidx=(s,u)=>clamp(Math.round((u+.25)*30),0,SN[s]-1);
function need(t){t=((t%DUR)+DUR)%DUR;let i=0;for(let k=3;k>=0;k--)if(t>=B[k]){i=k;break}
  const lt=t-B[i],nb=B[i]+LEN[i],r=[[i,lt]];if(lt<.35){const o=(i+3)%4;r.push([o,lt+LEN[o]])}else if(nb-t<.25)r.push([(i+1)%4,t-nb]);return r}
window.prepFrame=async t=>{const keep={};for(const[s,u]of need(t)){const k=s+"_"+fidx(s,u);keep[k]=1;if(CACHE[k])continue;
  const im=new Image();im.src="frames/s"+(s+1)+"_"+String(fidx(s,u)).padStart(4,"0")+".png";try{await im.decode();CACHE[k]=im}catch(e){}}
  for(const k in CACHE)if(!keep[k])delete CACHE[k]};
const SC=[0,1,2,3].map(s=>(g,u)=>{const im=CACHE[s+"_"+fidx(s,u)];if(im)g.drawImage(im,186,0,534,H);else SC2D[s](g,u)});
function render(t){
  t=((t%DUR)+DUR)%DUR;const g=ctx;base(g);g.globalAlpha=1;g.globalCompositeOperation="source-over";g.shadowBlur=0;
  let i=0;for(let k=3;k>=0;k--)if(t>=B[k]){i=k;break}
  const lt=t-B[i],nb=B[i]+LEN[i];let tr=null;
  if(lt<.35){const o=(i+3)%4;tr={o,n:i,to:lt+LEN[o],tn:lt,p:prog(lt,-.25,.35)}}
  else if(nb-t<.25)tr={o:i,n:(i+1)%4,to:lt,tn:t-nb,p:prog(t-nb,-.25,.35)};
  A=tr?mix(ACC[tr.o],ACC[tr.n],ioCub(tr.p)):ACC[i];
  bg(g,t);
  if(!tr)SC[i](g,lt);
  else{const e=lerp(170,790,ioCub(tr.p)),sl=34,poly=(x0,x1)=>{g.beginPath();g.moveTo(x0,0);g.lineTo(x1+sl,0);g.lineTo(x1-sl,H);g.lineTo(x0,H);g.closePath()};
    g.save();g.beginPath();g.moveTo(e+sl,0);g.lineTo(W+60,0);g.lineTo(W+60,H);g.lineTo(e-sl,H);g.closePath();g.clip();SC[tr.o](g,tr.to);g.restore();
    g.save();poly(-60,e);g.clip();bg(g,t);SC[tr.n](g,tr.tn);g.restore();
    g.save();g.globalCompositeOperation="lighter";const lg=g.createLinearGradient(e-40,0,e+40,0);lg.addColorStop(0,rgba(A,0));lg.addColorStop(.5,rgba(mix(A,[255,255,255],.6),.85));lg.addColorStop(1,rgba(A,0));
    g.fillStyle=lg;g.beginPath();g.moveTo(e-40+sl,0);g.lineTo(e+40+sl,0);g.lineTo(e+40-sl,H);g.lineTo(e-40-sl,H);g.closePath();g.fill();
    g.strokeStyle="#fff";g.lineWidth=2;g.beginPath();g.moveTo(e+sl,0);g.lineTo(e-sl,H);g.stroke();g.restore()}
  logoPanel(g,t,tr?tr.p:0);
}

/* ---------- boot ---------- */
async function boot(){
  await Promise.all(NAMES.map(n=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>{prep(n,i);res()};i.onerror=()=>rej(n);i.src="../ad/assets/"+n+".png"})));
  try{await Promise.all([document.fonts.load('100px "WG Anton"',"WASTA"),document.fonts.load('900 100px "WG Kufi"',TXT.brandKu+TXT.hoursLine)])}catch(e){}
  setup();window.renderAt=render;
  if(!CAP){const v=document.createElement("video");v.src="blender_s1/s1_popout.mp4";v.muted=true;v.playsInline=true;v.preload="auto";v.oncanplay=()=>{S1V=v};v.load()}
  if(!CAP){const t0=performance.now();(function loop(nw){render((nw-t0)/1000);requestAnimationFrame(loop)})(t0)}else render(Q.has("t")?+Q.get("t"):0);
}
window.ready=boot();
