<!doctype html>
<html lang="ckb"><head><meta charset="utf-8"><title>Wasta Ghareb item clip</title>
<style>
@font-face{font-family:CZ;font-weight:900;src:url(../fonts/cand/Cinzel-900.ttf)}
@font-face{font-family:MS;font-weight:800;src:url(../fonts/cand/Montserrat-800.ttf)}
@font-face{font-family:MS;font-weight:500;src:url(../fonts/cand/Montserrat-500.ttf)}
@font-face{font-family:VZ;font-weight:900;src:url(../fonts/cand/Vazirmatn-900.ttf)}
@font-face{font-family:VZ;font-weight:800;src:url(../fonts/cand/Vazirmatn-800.ttf)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000}
.f{position:relative;width:720px;height:200px;overflow:hidden;background:#000}
#clip{position:absolute;left:200px;top:0;width:520px;height:200px;object-fit:cover}
/* fade the clip's left edge into the portrait panel */
.edge{position:absolute;left:200px;top:0;width:40px;height:200px;background:linear-gradient(90deg,#000,transparent)}
.panel{position:absolute;left:0;top:0;width:212px;height:200px;background:radial-gradient(80% 90% at 50% 35%,#2a2113 0%,#0c0a07 60%,#000 100%);-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent)}
.arch{position:absolute;left:16px;top:8px;width:168px;height:184px;border-radius:84px 84px 8px 8px;border:2px solid #d9b25d;box-shadow:0 0 16px rgba(217,178,93,.3),inset 0 0 22px rgba(0,0,0,.85);overflow:hidden;background:radial-gradient(80% 70% at 50% 35%,#2b2416,#0a0906)}
.arch img{position:absolute;left:6px;top:14px;width:152px;height:166px;object-fit:contain;object-position:50% 100%}
.archgl{position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,236,190,.35) 50%,transparent 60%);background-size:300% 100%;background-repeat:no-repeat}
.txt{position:absolute;left:450px;width:262px;text-align:center;white-space:nowrap}
.gold{background:linear-gradient(180deg,#fff6cf 0%,#f7d27a 30%,#c99a3a 55%,#f3d58c 75%,#9a6b1f 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.kick{top:24px;font:500 11px MS;letter-spacing:6px;color:#d9b25d}
.head{top:40px;font:900 30px CZ;letter-spacing:1px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.9))}
.rule{position:absolute;left:506px;top:86px;width:150px;height:1px;background:linear-gradient(90deg,transparent,#d9b25d,transparent)}
.kur{top:92px;font:900 30px VZ;color:#fff;direction:rtl;text-shadow:0 2px 8px rgba(0,0,0,.9)}
.pill{position:absolute;left:521px;top:148px;width:120px;height:28px;border:1.5px solid #d9b25d;border-radius:14px;display:flex;align-items:center;justify-content:center;font:800 12px MS;letter-spacing:2px;color:#f3d58c;background:rgba(0,0,0,.35)}
.shine{position:absolute;left:440px;top:30px;width:280px;height:60px;background:linear-gradient(105deg,transparent 42%,rgba(255,250,230,.55) 50%,transparent 58%);background-size:300% 100%;background-repeat:no-repeat;mix-blend-mode:overlay;pointer-events:none}
.veil{position:absolute;inset:0;background:#000;pointer-events:none}
</style></head><body>
<div class="f" id="F">
  <img id="clip">
  <div class="edge"></div>
  <div class="panel"></div>
  <div class="arch"><img src="../ad/assets/logo.png"><div class="archgl" id="ag"></div></div>
  <div class="txt kick" id="k"></div>
  <div class="txt head gold" id="h"></div>
  <div class="rule" id="r"></div>
  <div class="txt kur" id="ku"></div>
  <div class="pill" id="p"></div>
  <div class="shine" id="sh"></div>
  <div class="veil" id="veil"></div>
</div>
<script>
/* item copy — text is composited here (never generated by the video model) so it is always correct */
const ITEMS={
  brand:{k:'',h:'WASTA GHAREB',ku:'وەستا غەریب',p:'',hs:34},
  pb_anker165:{k:'— ANKER —',h:'POWER BANK',ku:'لەم نزیکانە',p:'COMING SOON'},
  pb_maggo_stand:{k:'— ANKER —',h:'POWER BANK',ku:'لەم نزیکانە',p:'COMING SOON'},
  pb_qi2_blue:{k:'— ANKER —',h:'POWER BANK',ku:'لەم نزیکانە',p:'COMING SOON'},
  pb_anker20k:{k:'— ANKER —',h:'POWER BANK',ku:'لەم نزیکانە',p:'COMING SOON'},
  pb_instacord:{k:'— ANKER —',h:'POWER BANK',ku:'لەم نزیکانە',p:'COMING SOON'},
  adapter:{k:'— WASTA GHAREB —',h:'ADAPTER',ku:'بەردەستە',p:'IN STOCK'},
  cable_coil:{k:'— WASTA GHAREB —',h:'CABLE',ku:'بەردەستە',p:'IN STOCK'},
  magsafe:{k:'— WASTA GHAREB —',h:'MAGSAFE',ku:'بەردەستە',p:'IN STOCK'},
  hours:{k:'کاتی کردنەوە',h:'9 AM – 11 PM',ku:'لە ٩ی بەیانی تا ١١ی شەو',p:'',hs:30,kus:22,kk:true}
};
const $=id=>document.getElementById(id),clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),prog=(t,a,b)=>clamp((t-a)/(b-a));
const oCub=x=>1-Math.pow(1-x,3),oBack=(x,s=1.6)=>1+(s+1)*Math.pow(x-1,3)+s*Math.pow(x-1,2);
let DUR=5;
window.setItem=n=>{const it=ITEMS[n];$('k').textContent=it.k;$('h').textContent=it.h;$('ku').textContent=it.ku;$('p').textContent=it.p;
  $('p').style.display=it.p?'flex':'none';if(it.hs)$('h').style.fontSize=it.hs+'px';if(it.kus)$('ku').style.fontSize=it.kus+'px';
  if(it.kk){$('k').style.font='900 17px VZ';$('k').style.letterSpacing='0';$('k').style.direction='rtl';$('k').style.top='14px';$('k').className='txt kick gold'}
  if(!it.ku){$('r').style.display='none'}
  if(n==='brand'){$('h').style.top='52px';$('ku').style.top='104px';$('ku').className='txt kur gold';$('r').style.top='98px';$('k').style.display='none'}};
window.renderAt=t=>{
  const set=(id,a,dy=0,sc=1)=>{const e=$(id);e.style.opacity=a;e.style.transform=`translateY(${dy}px) scale(${sc})`};
  const q=k=>oCub(prog(t,.35+k*.18,.95+k*.18));
  set('k',q(0),(1-q(0))*-8);set('h',q(1),(1-q(1))*14,1+(1-q(1))*.08);
  $('r').style.opacity=q(2);$('r').style.transform=`scaleX(${q(2)})`;
  set('ku',q(3),(1-q(3))*12);const pq=prog(t,1.1,1.5);set('p',clamp(pq*2),0,oBack(pq,2)||0);
  const s=prog(t,2.4,3.2);$('sh').style.backgroundPosition=s>0&&s<1?`${130-160*s}% 0`:'-200% 0';
  const a=prog(t,3.4,4.2);$('ag').style.backgroundPosition=a>0&&a<1?`${130-160*a}% 0`:'-200% 0';
  $('veil').style.opacity=1-prog(t,0,.3)+prog(t,DUR-.3,DUR)};
window.setFrame=async src=>{const im=$('clip');im.src=src;await im.decode()};
window.ready=document.fonts.ready.then(()=>Promise.all([...document.images].map(i=>i.decode().catch(()=>0))));
</script></body></html>
