<!doctype html>
<html lang="ckb"><head><meta charset="utf-8"><title>Wasta Ghareb seamless loop</title>
<style>
@font-face{font-family:CZ;font-weight:900;src:url(../fonts/cand/Cinzel-900.ttf)}
@font-face{font-family:MS;font-weight:800;src:url(../fonts/cand/Montserrat-800.ttf)}
@font-face{font-family:MS;font-weight:500;src:url(../fonts/cand/Montserrat-500.ttf)}
@font-face{font-family:VZ;font-weight:900;src:url(../fonts/cand/Vazirmatn-900.ttf)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000}
.f{position:relative;width:720px;height:200px;overflow:hidden;background:#000}
.win{position:absolute;left:200px;top:0;width:520px;height:200px;overflow:hidden}
.win img{position:absolute;inset:0;width:520px;height:200px;object-fit:cover;transform-origin:30% 55%}
.flare{position:absolute;inset:0;background:radial-gradient(40% 70% at 30% 45%,rgba(255,214,140,.55),rgba(255,190,90,.12) 55%,transparent 75%);mix-blend-mode:screen;opacity:0}
.edge{position:absolute;left:200px;top:0;width:40px;height:200px;background:linear-gradient(90deg,#000,transparent)}
.panel{position:absolute;left:0;top:0;width:212px;height:200px;background:radial-gradient(80% 90% at 50% 35%,#2a2113 0%,#0c0a07 60%,#000 100%);-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent)}
.arch{position:absolute;left:16px;top:8px;width:168px;height:184px;border-radius:84px 84px 8px 8px;border:2px solid #d9b25d;box-shadow:0 0 16px rgba(217,178,93,.3),inset 0 0 22px rgba(0,0,0,.85);overflow:hidden;background:radial-gradient(80% 70% at 50% 35%,#2b2416,#0a0906)}
.arch img{position:absolute;left:6px;top:14px;width:152px;height:166px;object-fit:contain;object-position:50% 100%}
.archgl{position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,236,190,.35) 50%,transparent 60%);background-size:300% 100%;background-repeat:no-repeat}
.blk{position:absolute;left:440px;top:0;width:280px;height:200px}
.txt{position:absolute;left:10px;width:262px;text-align:center;white-space:nowrap}
.gold{background:linear-gradient(180deg,#fff6cf 0%,#f7d27a 30%,#c99a3a 55%,#f3d58c 75%,#9a6b1f 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.kick{top:24px;font:500 11px MS;letter-spacing:6px;color:#d9b25d}
.head{top:40px;font:900 30px CZ;letter-spacing:1px}
.rule{position:absolute;left:66px;top:86px;width:150px;height:1px;background:linear-gradient(90deg,transparent,#d9b25d,transparent)}
.kur{top:92px;font:900 30px VZ;color:#fff;direction:rtl;text-shadow:0 2px 8px rgba(0,0,0,.9)}
.pill{position:absolute;left:81px;top:148px;width:120px;height:28px;border:1.5px solid #d9b25d;border-radius:14px;display:flex;align-items:center;justify-content:center;font:800 12px MS;letter-spacing:2px;color:#f3d58c;background:rgba(0,0,0,.35)}
.shine{position:absolute;left:0;top:30px;width:280px;height:60px;background:linear-gradient(105deg,transparent 42%,rgba(255,250,230,.55) 50%,transparent 58%);background-size:300% 100%;background-repeat:no-repeat;mix-blend-mode:overlay}
</style></head><body>
<div class="f" id="F">
  <div class="win"><img id="A"><img id="B"><div class="flare" id="fl"></div></div>
  <div class="edge"></div>
  <div style="position:absolute;left:380px;top:0;width:340px;height:200px;background:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.55) 30%,rgba(0,0,0,.72) 100%)"></div>
  <div class="panel"></div>
  <div class="arch"><img src="../ad/assets/logo.png"><div class="archgl" id="ag"></div></div>
  <div id="blocks"></div>
  <div class="shine" id="sh" style="left:440px"></div>
</div>
<script>
/* one continuous 44 s loop: 10 Seedance clips of 5 s overlapping by XF; each hand-off continues the forward camera push
   (outgoing keeps flying toward the lens and dissolves, incoming settles from a slight zoom) under a soft gold flare.
   Text blocks only change when the copy changes, so identical copy never re-animates.                                 */
const ORDER=['brand','pb_anker165','pb_maggo_stand','pb_qi2_blue','pb_anker20k','pb_instacord','adapter','cable_coil','magsafe','hours'];
const COPY={brand:['','WASTA GHAREB','وەستا غەریب','',25],power:['— ANKER —','POWER BANK','لەم نزیکانە','COMING SOON'],
  adapter:['— WASTA GHAREB —','ADAPTER','بەردەستە','IN STOCK'],cable_coil:['— WASTA GHAREB —','CABLE','بەردەستە','IN STOCK'],
  magsafe:['— WASTA GHAREB —','MAGSAFE','بەردەستە','IN STOCK'],hours:['کاتی کردنەوە','9 AM – 11 PM','لە ٩ی بەیانی تا ١١ی شەو','',30]};
const key=n=>n.startsWith('pb_')?'power':n;
const CL=5,XF=.6,STEP=CL-XF,N=ORDER.length,LOOP=N*STEP,FPS=60;window.LOOP=LOOP;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),prog=(t,a,b)=>clamp((t-a)/(b-a)),io=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const $=id=>document.getElementById(id);
// text segments = runs of consecutive clips sharing the same copy
const SEG=[];ORDER.forEach((n,i)=>{const k=key(n);if(SEG.length&&SEG[SEG.length-1].k===k)SEG[SEG.length-1].n++;else SEG.push({k,i,n:1})});
SEG.forEach(s=>{const c=COPY[s.k],d=document.createElement('div');d.className='blk';
  d.innerHTML=(c[0]?`<div class="txt kick ${s.k==='hours'?'gold':''}" style="${s.k==='hours'?'font:900 17px VZ;letter-spacing:0;direction:rtl;top:14px':''}">${c[0]}</div>`:'')+
  `<div class="txt head gold" style="${c[4]?'font-size:'+c[4]+'px;':''}${s.k==='brand'?'top:52px':''}">${c[1]}</div>`+
  (s.k!=='hours'?`<div class="rule" style="${s.k==='brand'?'top:98px':''}"></div>`:'')+
  `<div class="txt kur ${s.k==='brand'?'gold':''}" style="${s.k==='brand'?'top:104px':''}${s.k==='hours'?'font-size:22px':''}">${c[2]}</div>`+
  (c[3]?`<div class="pill">${c[3]}</div>`:'');
  $('blocks').appendChild(d);s.el=d;s.t0=s.i*STEP;s.t1=(s.i+s.n)*STEP});
const wrap=t=>((t%LOOP)+LOOP)%LOOP;
// which clips are on screen at t and their local times (handles the wrap from the last clip back to the first)
function active(t){t=wrap(t);const i=Math.floor(t/STEP)%N,lt=t-i*STEP,out=[{c:i,u:lt+0}];
  if(lt<XF)out.unshift({c:(i-1+N)%N,u:lt+STEP});return out}
window.frameFor=(c,u)=>({c,f:Math.min(299,Math.max(0,Math.round(u*FPS)))});
window.need=t=>active(t).map(a=>frameFor(a.c,a.u));
window.renderAt=(t,srcA,srcB)=>{t=wrap(t);const act=active(t),A=$('A'),B=$('B');
  if(act.length===1){A.style.opacity=1;A.style.transform='scale(1)';A.style.filter='';B.style.opacity=0;$('fl').style.opacity=0}
  else{const p=io(prog(act[0].u,STEP,CL));   // 0..1 across the hand-off
    A.style.opacity=1-p;A.style.transform=`scale(${1+.28*p})`;A.style.filter=`blur(${2.5*p}px)`;
    B.style.opacity=clamp(p*1.25);B.style.transform=`scale(${1.1-.1*p})`;B.style.filter=`blur(${2*(1-p)}px)`;
    $('fl').style.opacity=Math.sin(Math.PI*p)*.9}
  // text: blocks dissolve with a soft blur only where the copy actually changes
  SEG.forEach((s,k)=>{let a=0,dy=0,bl=0;const start=wrap(s.t0),len=s.t1-s.t0,lt=wrap(t-s.t0);
    if(lt<len+XF){const pin=prog(lt,0,XF),pout=prog(lt,len,len+XF);a=io(pin)*(1-io(pout));dy=(1-io(pin))*6-io(pout)*6;bl=(1-io(pin))*5+io(pout)*5}
    s.el.style.opacity=a;s.el.style.transform=`translateY(${dy}px)`;s.el.style.filter=bl>.05?`blur(${bl}px)`:''});
  const sp=prog(wrap(t)%STEP,1.6,2.4);$('sh').style.backgroundPosition=sp>0&&sp<1?`${130-160*sp}% 0`:'-200% 0';
  const ap=prog(wrap(t)%(STEP*2),5.6,6.6);$('ag').style.backgroundPosition=ap>0&&ap<1?`${130-160*ap}% 0`:'-200% 0'};
window.setFrames=async(a,b)=>{const A=$('A'),B=$('B');A.src=a;if(b)B.src=b;await Promise.all([A.decode(),b?B.decode():0])};
window.ready=document.fonts.ready.then(()=>Promise.all([...document.images].filter(i=>i.src).map(i=>i.decode().catch(()=>0))));
</script></body></html>
