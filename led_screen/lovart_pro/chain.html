<!doctype html>
<html lang="ckb"><head><meta charset="utf-8"><title>Wasta Ghareb morph loop</title>
<style>
@font-face{font-family:CZ;font-weight:900;src:url(../fonts/cand/Cinzel-900.ttf)}
@font-face{font-family:MS;font-weight:800;src:url(../fonts/cand/Montserrat-800.ttf)}
@font-face{font-family:MS;font-weight:500;src:url(../fonts/cand/Montserrat-500.ttf)}
@font-face{font-family:VZ;font-weight:900;src:url(../fonts/cand/Vazirmatn-900.ttf)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000}
.f{position:relative;width:720px;height:200px;overflow:hidden;background:#000}
.win{position:absolute;left:200px;top:0;width:520px;height:200px;overflow:hidden}
.win img{position:absolute;inset:0;width:520px;height:200px;object-fit:cover}
.edge{position:absolute;left:200px;top:0;width:40px;height:200px;background:linear-gradient(90deg,#000,transparent)}
.dim{position:absolute;left:380px;top:0;width:340px;height:200px;background:linear-gradient(90deg,transparent,rgba(0,0,0,.55) 30%,rgba(0,0,0,.72))}
.panel{position:absolute;left:0;top:0;width:212px;height:200px;background:radial-gradient(80% 90% at 50% 35%,#2a2113 0%,#0c0a07 60%,#000 100%);-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent)}
.arch{position:absolute;left:16px;top:8px;width:168px;height:184px;border-radius:84px 84px 8px 8px;border:2px solid #d9b25d;box-shadow:0 0 16px rgba(217,178,93,.3),inset 0 0 22px rgba(0,0,0,.85);overflow:hidden;background:radial-gradient(80% 70% at 50% 35%,#2b2416,#0a0906)}
.arch img{position:absolute;left:6px;top:14px;width:152px;height:166px;object-fit:contain;object-position:50% 100%}
.archgl{position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,236,190,.35) 50%,transparent 60%);background-size:300% 100%;background-repeat:no-repeat}
.blk{position:absolute;left:440px;top:0;width:280px;height:200px}
.txt{position:absolute;left:10px;width:262px;text-align:center;white-space:nowrap}
.gold{background:linear-gradient(180deg,#fff6cf 0%,#f7d27a 30%,#c99a3a 55%,#f3d58c 75%,#9a6b1f 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.kick{top:24px;font:500 11px MS;letter-spacing:6px}
.head{top:40px;font:900 30px CZ;letter-spacing:1px}
.rule{position:absolute;left:66px;top:86px;width:150px;height:1.5px}
.kur{top:92px;font:900 30px VZ;color:#fff;direction:rtl;text-shadow:0 2px 8px rgba(0,0,0,.9)}
.pill{position:absolute;left:81px;top:148px;width:120px;height:28px;border:1.5px solid;border-radius:14px;display:flex;align-items:center;justify-content:center;font:800 12px MS;letter-spacing:2px;color:#f3d58c;background:rgba(0,0,0,.35)}
.shine{position:absolute;left:440px;top:30px;width:280px;height:60px;background:linear-gradient(105deg,transparent 42%,rgba(255,250,230,.55) 50%,transparent 58%);background-size:300% 100%;background-repeat:no-repeat;mix-blend-mode:overlay}
</style></head><body>
<div class="f" id="F">
  <div class="win"><img id="A"><img id="B"></div>
  <div class="edge"></div><div class="dim"></div><div class="panel"></div>
  <div class="arch"><img src="../ad/assets/logo.png"><div class="archgl" id="ag"></div></div>
  <div id="blocks"></div><div class="shine" id="sh"></div>
</div>
<script>
/* chain of Seedance morph clips: clip i = item i (0-2.5 s) morphing into item i+1 (2.5-5 s). Clips overlap by XF to hide the
   tiny end/start frame difference. Text block of item j is on screen from the morph in clip j-1 until the morph in clip j.  */
const ITEMS=[['pb_anker165','#d4a24c'],['pb_maggo_stand','#b3122a'],['pb_qi2_blue','#1f5fd6'],['pb_anker20k','#109467'],['pb_instacord','#7b3fc4'],
  ['adapter','#c9d3e0'],['cable_coil','#c06a2b'],['magsafe','#8e1b3d'],['hours','#d4a24c']];
const COPY={power:['— ANKER —','POWER BANK','لەم نزیکانە','COMING SOON'],adapter:['— WASTA GHAREB —','ADAPTER','بەردەستە','IN STOCK'],
  cable_coil:['— WASTA GHAREB —','CABLE','بەردەستە','IN STOCK'],magsafe:['— WASTA GHAREB —','MAGSAFE','بەردەستە','IN STOCK'],hours:['کاتی کردنەوە','9 AM – 11 PM','لە ٩ی بەیانی تا ١١ی شەو','']};
const CL=5,XF=.25,STEP=CL-XF,N=ITEMS.length,LOOP=N*STEP,FPS=60,TSW=3.25,TF=.6;window.LOOP=LOOP;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),prog=(t,a,b)=>clamp((t-a)/(b-a)),io=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const $=id=>document.getElementById(id),wrap=t=>((t%LOOP)+LOOP)%LOOP;
const BL=ITEMS.map(([n,acc])=>{const c=COPY[n.startsWith('pb_')?'power':n],h=n==='hours',d=document.createElement('div');d.className='blk';
  d.innerHTML=`<div class="txt kick ${h?'gold':''}" style="color:${acc};${h?'font:900 17px VZ;letter-spacing:0;direction:rtl;top:14px':''}">${c[0]}</div>
   <div class="txt head gold">${c[1]}</div>${h?'':`<div class="rule" style="background:linear-gradient(90deg,transparent,${acc},transparent)"></div>`}
   <div class="txt kur" style="${h?'font-size:22px':''}">${c[2]}</div>${c[3]?`<div class="pill" style="border-color:${acc};box-shadow:0 0 10px ${acc}55">${c[3]}</div>`:''}`;
  $('blocks').appendChild(d);return d});
function active(t){t=wrap(t);const i=Math.floor(t/STEP)%N,lt=t-i*STEP,out=[{c:i,u:lt}];if(lt<XF)out.unshift({c:(i-1+N)%N,u:lt+STEP});return out}
window.need=t=>active(t).map(a=>({c:a.c,f:Math.min(299,Math.max(0,Math.round(a.u*FPS)))}));
window.renderAt=t=>{t=wrap(t);const act=active(t),A=$('A'),B=$('B');
  if(act.length===1){A.style.opacity=1;B.style.opacity=0}else{const p=io(prog(act[0].u,STEP,CL));A.style.opacity=1;B.style.opacity=p}
  // text: block j fades in at clip (j-1) local TSW, out at clip j local TSW
  BL.forEach((el,j)=>{const tin=wrap((j-1)*STEP+TSW),len=STEP,lt=wrap(t-tin);let a=0,bl=0,dy=0;
    if(lt<len+TF){const pi=io(prog(lt,0,TF)),po=io(prog(lt,len,len+TF));a=pi*(1-po);bl=(1-pi)*5+po*5;dy=(1-pi)*5-po*5}
    el.style.opacity=a;el.style.filter=bl>.05?`blur(${bl}px)`:'';el.style.transform=`translateY(${dy}px)`});
  const s=prog(wrap(t-TSW-.9)%STEP,0,.8);$('sh').style.backgroundPosition=s>0&&s<1?`${130-160*s}% 0`:'-200% 0';
  const g=prog(wrap(t)%(STEP*3),6,7);$('ag').style.backgroundPosition=g>0&&g<1?`${130-160*g}% 0`:'-200% 0'};
window.setFrames=async(a,b)=>{const A=$('A'),B=$('B');A.src=a;if(b)B.src=b;await Promise.all([A.decode(),b?B.decode():0])};
window.ready=document.fonts.ready.then(()=>Promise.all([...document.images].filter(i=>i.src).map(i=>i.decode().catch(()=>0))));
</script></body></html>
