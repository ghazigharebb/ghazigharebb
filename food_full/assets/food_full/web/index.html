.btn{border:0;border-radius:16px;padding:13px 16px;font-weight:800;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.p{background:var(--prime);color:#04323a;box-shadow:0 10px 24px -14px var(--mint)}
.btn.s{background:var(--surf2);border:1px solid var(--line);color:var(--tx)}
.btn.ai{background:var(--ai);color:#fff;box-shadow:0 12px 28px -14px #7b4dff}
.btn.w{width:100%}
.btn:disabled{opacity:.55;cursor:default}
.in{width:100%;border:1px solid var(--line);border-radius:15px;padding:13px 14px;font-size:14px;background:var(--in);color:var(--tx);outline:none;transition:border .2s}
.in:focus{border-color:var(--cy)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips.hs{flex-wrap:nowrap;overflow-x:auto;margin:12px -16px 0;padding:2px 16px;scrollbar-width:none}
.chips.hs::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);border-radius:99px;padding:8px 13px;background:var(--surf2);color:var(--tx);font-weight:700;font-size:12px;cursor:pointer;white-space:nowrap}
.chip.on{background:linear-gradient(135deg,rgba(143,243,249,.2),rgba(60,240,138,.18));color:var(--mint);border-color:rgba(60,240,138,.55)}
.muted{color:var(--mu);font-size:12px;line-height:1.8}
/* date */
.dbar{display:flex;align-items:center;gap:10px;margin-top:16px}
.dbar button{width:42px;height:42px;border-radius:15px;border:1px solid var(--line);background:var(--surf);color:var(--tx);font-size:18px;cursor:pointer}
.dbar button:disabled{opacity:.25}
.dbar div{flex:1;text-align:center}
.dbar b{display:block;font-size:18px;font-weight:800}
.dbar small{color:var(--mu);font-size:12px}
.dbar a{color:var(--cy);font-weight:700}
/* orb hero */
.orbc{margin-top:8px;display:flex;flex-direction:column;align-items:center}
.orb{position:relative;width:min(272px,74vw);aspect-ratio:1}
.orb .halo{position:absolute;inset:14%;border-radius:50%;background:radial-gradient(circle,rgba(255,150,110,.28),rgba(123,77,255,.12) 55%,transparent 70%);filter:blur(10px);animation:hl 5s ease-in-out infinite}
@keyframes hl{50%{transform:scale(1.08);opacity:.75}}
.orb svg{position:relative;width:100%;height:100%;transform:rotate(-90deg)}
.orb circle{fill:none;stroke-linecap:round;transition:stroke-dasharray 1.400s cubic-bezier(.2,.9,.2,1)}
.omid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.omid small{font-size:12px;color:var(--mu);font-weight:700}
.omid b{font-size:44px;font-weight:800;line-height:1.05;direction:ltr}
.omid span{font-size:12px;color:var(--mu);font-family:"Sora",sans-serif}
.left{margin-top:4px;padding:7px 16px;border-radius:99px;background:rgba(60,240,138,.12);border:1px solid rgba(60,240,138,.35);color:var(--mint);font-size:13px;font-weight:700}
.left b{font-size:15px}
.left.over{background:rgba(255,95,126,.12);border-color:rgba(255,95,126,.4);color:var(--bd)}
.leg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;margin-top:16px}
.leg div{text-align:center}
.leg span{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:var(--mu);font-weight:700}
.leg i{width:9px;height:9px;border-radius:50%;background:var(--k);box-shadow:0 0 10px var(--k)}
.leg b{display:block;font-size:19px;font-weight:800;direction:ltr;margin-top:3px}
.leg b small,.bar2 b small,.wi b small{font-size:11px;color:var(--mu);font-weight:600}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;margin-top:14px}
.trio div{display:flex;flex-direction:column;align-items:center;padding:11px 4px;border-radius:18px;background:var(--surf);border:1px solid var(--line)}
.trio span{font-size:16px}
.trio b{font-size:17px;font-weight:800;direction:ltr}
.trio small{font-size:11px;color:var(--mu)}
.nstrip{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bar2 .t{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--mu);font-weight:700}
.bar2 .t b{color:var(--tx);direction:ltr;font-size:14px}
.br{height:8px;border-radius:99px;background:var(--track);overflow:hidden;margin-top:7px;direction:ltr}
.br i{display:block;height:100%;border-radius:99px;background:var(--k,var(--cy));box-shadow:0 0 12px var(--k,var(--cy));transition:width 1s cubic-bezier(.2,.9,.2,1)}
.mic{grid-column:1/-1;display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:16px;padding:11px 14px;background:var(--surf2);font-weight:800;font-size:13px;cursor:pointer;color:var(--tx)}
.mic span{font-size:18px}.mic em{margin-inline-start:auto;font-style:normal;color:var(--mu)}
/* scan banner */
.scanb{position:relative;display:flex;align-items:center;gap:16px;width:100%;margin-top:14px;padding:16px;border:0;border-radius:28px;cursor:pointer;color:#fff;text-align:start;background:var(--ai);overflow:hidden;box-shadow:0 22px 44px -24px #7b4dff;isolation:isolate}
.scanb:before{content:"";position:absolute;inset:-60%;z-index:-1;background:conic-gradient(from 0deg,transparent,rgba(255,255,255,.22),transparent 25%,rgba(60,240,138,.25),transparent 55%);animation:rot 9s linear infinite}
.scanb:after{content:"";position:absolute;inset:1px;z-index:-1;border-radius:27px;background:linear-gradient(135deg,rgba(98,60,230,.95),rgba(60,90,240,.92) 50%,rgba(14,150,190,.95))}
@keyframes rot{to{transform:rotate(360deg)}}
.vf{position:relative;width:92px;height:92px;flex:none;border-radius:20px;background:rgba(0,0,0,.18);display:grid;place-items:center;overflow:hidden}
.vf i{position:absolute;width:20px;height:20px;border:3px solid #fff;opacity:.9}
.vf i:nth-child(1){top:8px;left:8px;border-right:0;border-bottom:0;border-radius:8px 0 0 0}
.vf i:nth-child(2){top:8px;right:8px;border-left:0;border-bottom:0;border-radius:0 8px 0 0}
.vf i:nth-child(3){bottom:8px;left:8px;border-right:0;border-top:0;border-radius:0 0 0 8px}
.vf i:nth-child(4){bottom:8px;right:8px;border-left:0;border-top:0;border-radius:0 0 8px 0}
.vf em{font-style:normal;font-size:38px;animation:bob 2.400s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px) scale(1.05)}}
.vl{position:absolute;inset-inline:10px;top:12px;height:2px;background:#3cf08a;box-shadow:0 0 12px 3px #3cf08a;animation:vl 1.800s ease-in-out infinite alternate}
@keyframes vl{to{top:78px}}
.scanb .st b{display:block;font-size:17px;font-weight:800}
.scanb .st small{display:block;font-size:12px;opacity:.85;line-height:1.7;margin-top:2px}
.scanb .go{display:inline-block;margin-top:9px;padding:7px 14px;border-radius:99px;background:#fff;color:#4b2fc4;font-size:12px;font-weight:800}
.qa3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.qa3 button{display:flex;align-items:center;justify-content:center;gap:7px;padding:13px 6px;border-radius:18px;border:1px solid var(--line);background:var(--surf);color:var(--tx);font-weight:800;font-size:13px;cursor:pointer;backdrop-filter:blur(10px)}
.qa3 span{font-size:18px}
/* timeline */
.tline{position:relative;margin-top:8px}
.tline:before{content:"";position:absolute;top:30px;bottom:30px;right:21px;width:2px;background:linear-gradient(var(--line2),transparent)}
.tl{position:relative;display:flex;gap:12px;margin-top:12px}
.tn{flex:none;width:44px;display:flex;justify-content:center;padding-top:12px}
.tn span{width:44px;height:44px;border-radius:16px;display:grid;place-items:center;font-size:21px;background:linear-gradient(145deg,color-mix(in srgb,var(--k) 38%,transparent),color-mix(in srgb,var(--k) 12%,transparent));border:1px solid color-mix(in srgb,var(--k) 55%,transparent);box-shadow:0 8px 20px -10px var(--k)}
.tc{flex:1;min-width:0;padding:14px;border-radius:24px;background:var(--surf);border:1px solid var(--line);backdrop-filter:blur(14px)}
.th{display:flex;align-items:center;gap:10px}
.th div:first-child{flex:1}
.th b{display:block;font-size:15px;font-weight:800}
.th small{color:var(--mu);font-size:12px;font-family:"Sora","Noto Sans Arabic",sans-serif}
.tk{text-align:center;line-height:1}
.tk b{font-size:20px;font-weight:800;color:var(--k);direction:ltr}
.tk small{font-size:10px}
.plus{width:36px;height:36px;border-radius:12px;border:0;cursor:pointer;display:grid;place-items:center;background:linear-gradient(145deg,color-mix(in srgb,var(--k) 85%,#fff 0%),color-mix(in srgb,var(--k) 60%,#000 10%));box-shadow:0 8px 18px -8px var(--k)}
.plus svg{width:18px;height:18px;stroke:#062832;stroke-width:3;stroke-linecap:round}
.share{height:4px;border-radius:99px;background:var(--track);margin:10px 0 2px;overflow:hidden;direction:ltr}
.share i{display:block;height:100%;background:var(--k);border-radius:99px}
.fi{display:flex;align-items:center;gap:9px;margin-top:8px;padding:10px 11px;border-radius:15px;background:var(--surf2);border:1px solid var(--line);font-size:13px;cursor:pointer;width:100%;color:var(--tx);text-align:start}
.fi .n{flex:1;min-width:0;line-height:1.5;font-weight:700}
.fi .n small{display:block;color:var(--mu);font-size:11px;direction:ltr;text-align:right;font-weight:600}
.fi .k{direction:ltr;font-weight:800;color:var(--or);font-size:15px}
.fc{width:19px;height:19px;flex:none;stroke:var(--k);fill:none;stroke-width:1.800;stroke-linecap:round;stroke-linejoin:round}
.emp{width:100%;margin-top:10px;padding:10px;border-radius:14px;border:1.500px dashed color-mix(in srgb,var(--k) 55%,transparent);background:transparent;color:var(--k);font-weight:800;font-size:13px;cursor:pointer}
/* water */
.water{display:flex;align-items:center;gap:18px}
.btl{width:108px;flex:none;filter:drop-shadow(0 12px 22px rgba(47,230,243,.25))}
#wl{transition:transform 1.200s cubic-bezier(.2,.9,.2,1)}
.wv1{animation:wv 3.500s linear infinite}.wv2{animation:wv 5s linear infinite reverse}
@keyframes wv{to{transform:translateX(60px)}}
.wi{flex:1;display:flex;flex-direction:column;gap:3px}
.wi .lb{font-size:13px;font-weight:800;color:var(--mu)}
.wi b{font-size:30px;font-weight:800;direction:ltr;text-align:right;color:var(--c2)}
.wg{font-size:12px;color:var(--mu)}
.wb{display:flex;gap:6px;margin-top:8px}
.wb button{flex:1;border:1px solid var(--line);border-radius:13px;padding:10px 4px;background:var(--surf2);font-weight:800;font-size:13px;cursor:pointer;font-family:"Sora","Noto Sans Arabic",sans-serif}
.wb .p{flex:1.6;background:linear-gradient(135deg,#8ff3f9,#14b8d6);color:#04323a;border:0}
.wm{font-size:12px;color:var(--mu);margin-top:4px}
.ins{display:grid;gap:10px;margin-top:10px}
.ins div{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:20px;background:var(--surf);border:1px solid var(--line)}
.ins span{width:38px;height:38px;flex:none;border-radius:13px;display:grid;place-items:center;font-size:19px;background:color-mix(in srgb,var(--k) 18%,transparent)}
.ins p{margin:0;font-size:13px;line-height:1.85}
/* search */
.sbar{display:flex;align-items:center;gap:10px;margin-top:16px;padding:4px 14px;border-radius:20px;background:var(--surf);border:1px solid var(--line2);backdrop-filter:blur(14px)}
.sbar svg{width:20px;height:20px;stroke:var(--cy);fill:none;stroke-width:2.200;stroke-linecap:round;flex:none}
.sbar input{flex:1;border:0;background:none;padding:12px 0;font-size:15px;outline:none;color:var(--tx)}
.cnt2{margin:14px 4px 0;font-size:12px;color:var(--mu);font-weight:700}
.fr{display:flex;align-items:center;gap:12px;margin-top:9px;padding:12px;border-radius:22px;background:var(--surf);border:1px solid var(--line);backdrop-filter:blur(12px)}
.fe{width:46px;height:46px;flex:none;border-radius:16px;display:grid;place-items:center;font-size:24px;background:var(--surf2);border:1px solid var(--line)}
.fr .i{flex:1;min-width:0}
.fr .i b{display:block;font-size:14px;font-weight:800;line-height:1.5}
.fr .i small{color:var(--mu);font-size:11px}
.mm{display:flex;gap:10px;margin-top:4px;font-size:11px;direction:ltr;justify-content:flex-end;color:var(--mu);font-weight:700}
.mm span{display:flex;align-items:center;gap:4px}
.mm i{width:7px;height:7px;border-radius:50%;background:var(--k)}
.fr .kc{text-align:center;min-width:48px;line-height:1.1}
.fr .kc b{font-size:18px;font-weight:800;direction:ltr}
.fr .kc small{font-size:10px;color:var(--mu)}
.fr .ac{display:flex;flex-direction:column;gap:6px}
.fr .st{width:34px;height:30px;border-radius:10px;border:1px solid var(--line);background:none;font-size:15px;cursor:pointer;color:var(--mu)}
.fr .st.on{color:var(--amber);border-color:rgba(255,190,77,.5)}
.fr .ad{width:34px;height:34px;border-radius:11px;border:0;background:var(--prime);cursor:pointer;display:grid;place-items:center}
.fr .ad svg{width:16px;height:16px;stroke:#04323a;stroke-width:3;stroke-linecap:round}
.emptyc{text-align:center}.emptyc .e{font-size:44px}
.row{display:flex;align-items:center;gap:10px;margin-top:8px;padding:12px;border-radius:18px;background:var(--surf2);border:1px solid var(--line)}
.row .i{flex:1}.row b{display:block;font-size:14px;font-family:"Sora","Noto Sans Arabic",sans-serif}.row small{color:var(--mu);font-size:11px}
.srch{display:flex;gap:8px}
/* sheet */
.sheet{position:fixed;inset:0;z-index:40;display:none;align-items:flex-end;justify-content:center;background:rgba(1,12,16,.62);backdrop-filter:blur(4px)}
.sheet.on{display:flex}
.sh{position:relative;width:100%;max-width:440px;max-height:92vh;overflow-y:auto;padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 22px);border-radius:32px 32px 0 0;background:var(--sheet);border-top:1px solid var(--line2);box-shadow:0 -20px 60px -20px rgba(123,77,255,.35);animation:sup .45s cubic-bezier(.2,.9,.3,1)}
.sh:before{content:"";position:absolute;top:0;left:20%;right:20%;height:1px;background:linear-gradient(90deg,transparent,var(--cy),transparent)}
@keyframes sup{from{transform:translateY(100%)}}
.grab{width:46px;height:5px;border-radius:9px;background:var(--line2);margin:4px auto 14px}
.sh h3{margin:0 0 14px;font-size:18px;font-weight:800;text-align:center;display:flex;align-items:center;justify-content:center;gap:8px}
.opt{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 8px;border-radius:22px;border:1px solid var(--line);background:var(--surf2);color:var(--tx);font-weight:800;font-size:13px;cursor:pointer}
.opt button:first-child{background:var(--ai);color:#fff;border:0}
.opt .e{font-size:30px}
.mul{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.mlp{display:grid;grid-template-columns:repeat(auto-fit,minmax(62px,1fr));gap:6px}
.mlp button,.mul button{border:1px solid var(--line);border-radius:15px;padding:10px 2px;background:var(--surf2);color:var(--tx);font-weight:800;font-size:12px;cursor:pointer;font-family:"Sora","Noto Sans Arabic",sans-serif;line-height:1.5}
.mlp button.on,.mul button.on{background:linear-gradient(135deg,rgba(143,243,249,.2),rgba(60,240,138,.2));border-color:var(--mint);color:var(--mint)}
.abar{position:sticky;bottom:calc(-1 * (env(safe-area-inset-bottom,0px) + 22px));z-index:6;margin:12px -16px calc(-1 * (env(safe-area-inset-bottom,0px) + 22px));padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;flex-direction:column;gap:8px;background:linear-gradient(180deg,transparent,var(--sheet) 18%);border-top:1px solid transparent}
.abar:before{content:"";position:absolute;inset:14px 0 0;background:var(--sheet);z-index:-1;box-shadow:0 -14px 24px -12px rgba(0,0,0,.55)}
.abar .auto{margin-top:0;padding:8px 12px;font-size:12.5px}
.abar .mlp{margin-top:0}
.abar .btn.p{padding:15px;font-size:15.5px;border-radius:18px}
.tline{margin-top:6px}.tl{margin-top:8px;gap:10px}.tn{width:38px;padding-top:9px}
.tc{padding:11px 12px;border-radius:20px}
.tl .share{margin:8px 0 0}
.tl:not(.now) .emp{display:none}
.tl.now .tc{border-color:color-mix(in srgb,var(--k) 60%,transparent);background:linear-gradient(135deg,color-mix(in srgb,var(--k) 12%,transparent),var(--surf));box-shadow:0 12px 28px -18px var(--k)}
.tl.now .emp{margin-top:9px;padding:9px}
.nowc{font-style:normal;display:inline-block;margin-inline-end:6px;padding:1px 7px;border-radius:99px;background:color-mix(in srgb,var(--k) 22%,transparent);color:var(--k);font-weight:800;font-size:10.5px}
.water{gap:14px;padding:12px 14px!important}.btl{width:64px}.wi b{font-size:24px}.wi .wg{font-size:11.5px}.wi .wb{margin-top:6px}.wi .wm{font-size:11px}.wb button{white-space:nowrap;padding:9px 4px}
.lbl{display:block;margin:14px 0 7px;font-size:12px;font-weight:800;color:var(--mu)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
/* scan */
.scan{position:relative;border-radius:24px;overflow:hidden;background:#021419;min-height:200px}
.scan img{display:block;width:100%;max-height:300px;object-fit:cover}
.scan .ph{height:200px;display:grid;place-items:center;font-size:64px}
.las{position:absolute;inset-inline:6%;top:8%;height:3px;border-radius:9px;background:linear-gradient(90deg,transparent,#3cf08a,transparent);box-shadow:0 0 22px 5px #3cf08a;animation:las 1.600s ease-in-out infinite alternate}
@keyframes las{to{top:88%}}
.grd{position:absolute;inset:0;background-image:linear-gradient(rgba(60,240,138,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(60,240,138,.12) 1px,transparent 1px);background-size:22px 22px;mask-image:radial-gradient(circle,#000 30%,transparent 80%);-webkit-mask-image:radial-gradient(circle,#000 30%,transparent 80%);animation:fg 1.100s ease-in-out infinite alternate}
@keyframes fg{to{opacity:.35}}
.vfc i{position:absolute;width:34px;height:34px;border:3px solid #3cf08a;filter:drop-shadow(0 0 6px #3cf08a);animation:vfp 1.400s ease-in-out infinite alternate}
.vfc i:nth-child(1){top:14px;left:14px;border-right:0;border-bottom:0;border-radius:12px 0 0 0}
.vfc i:nth-child(2){top:14px;right:14px;border-left:0;border-bottom:0;border-radius:0 12px 0 0}
.vfc i:nth-child(3){bottom:62px;left:14px;border-right:0;border-top:0;border-radius:0 0 0 12px}
.vfc i:nth-child(4){bottom:62px;right:14px;border-left:0;border-top:0;border-radius:0 0 12px 0}
@keyframes vfp{to{transform:scale(.88)}}
.sst{position:absolute;inset-inline:10px;bottom:10px;display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:16px;background:rgba(2,20,25,.82);backdrop-filter:blur(8px);color:#eaffff;font-size:13px;font-weight:700}
.dots i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#3cf08a;margin:0 2px;animation:dt 1s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dt{50%{transform:translateY(-5px);opacity:.4}}
/* result */
.rhero{position:relative;min-height:190px;border-radius:26px;overflow:hidden;background:#0b3a48 center/cover no-repeat;display:flex;align-items:flex-end;padding:16px}
.rhero.noimg{background:radial-gradient(circle at 70% 30%,rgba(255,148,102,.45),transparent 60%),var(--ai)}
.rov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(2,16,22,.85))}
.rem{position:absolute;top:22px;left:50%;transform:translateX(-50%);font-size:60px}
.rin{position:relative;flex:1;color:#fff}
.rin h4{margin:6px 0 0;font-size:19px;font-weight:800;line-height:1.45}
.dm2{font-size:11px;padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.18)}
.vd{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:99px;font-size:12px;font-weight:800;color:#fff;background:color-mix(in srgb,var(--k) 70%,transparent);backdrop-filter:blur(6px)}
.vd svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:1.800;stroke-linecap:round;stroke-linejoin:round}
.sc{position:relative;width:68px;height:68px;flex:none;align-self:center}
.sc svg{width:100%;height:100%;transform:rotate(-90deg)}

   <span class="lbl">ئارەزووت چییە؟</span><div class="chips" id="hp">${PREFS2.map(p=>`<button class="chip" data-p="${p[0]}">${p[1]}</button>`).join('')}</div>
   <div id="ideas"></div>
   <span class="lbl">📝 تێبینی بۆ AI (ئارەزوومەندانە)</span><input class="in" id="hNote" maxlength="120" placeholder="بۆ نموونە: شتێکی گەرم کە لە ماڵ هەبێت، بێ برنج...">
   <button class="btn ai w" id="hAi" style="margin-top:10px">✨ پێشنیاری AI بەپێی ئارەزووم</button>`,c=>{draw(c);
   c.querySelectorAll('#hp .chip').forEach(b=>b.onclick=()=>{const p=b.dataset.p,i=prefs.indexOf(p);if(i>=0)prefs.splice(i,1);else prefs.push(p);b.classList.toggle('on');cards=[];shown=[];fill();draw(c)});
   c.querySelector('#hAi').onclick=async()=>{const bt=c.querySelector('#hAi');bt.disabled=true;bt.textContent='✨ بیر دەکاتەوە...';
    try{if(!SAMPLE){await new Promise(z=>setTimeout(z,700));toast('AI تەنها لە ناو Claude کار دەکات');return}
     const r=await SAMPLE.json(`You are a friendly nutrition coach for Kurdish people. The person is hungry right now at ${nowHM()} (${mealName(slot)}). Calories left today: ${Math.max(0,Math.round(rem))} kcal; target for this meal about ${Math.round(target)} kcal; protein still needed ${Math.max(0,Math.round(pDef))} g.\n${ctx()}\nPreferences: ${prefs.map(p=>PREFS2.find(x=>x[0]===p)[1]).join(', ')||'none'}. Their note: "${c.querySelector('#hNote').value.trim().slice(0,120)}". Do not suggest: ${S.nope.slice(-10).join(', ')||'-'}.\n${KU}Reply with ONLY JSON: {"ideas":[{"name":"short meal name","items":"short list of foods with amounts","kcal":300,"protein_g":25,"carbs_g":20,"fat_g":10,"why":"one short reason for this person now"}]} with exactly 2 ideas using foods easy to find in Kurdistan, respecting allergies and health conditions, light if it is late at night.`,{cache:false});
     ai=(r&&r.ideas||[]).slice(0,3);draw(c)}
    catch(e){toast('⚠️ '+errMsg(e))}finally{bt.disabled=false;bt.textContent='✨ پێشنیاری AI بەپێی ئارەزووم'}}})}

// ---------------- tabs ----------------
const TABS=[['today','🏠','ئەمڕۆ'],['search','🔎','گەڕان'],['plan','🏆','ڕاهێنەر'],['stats','📈','شیکاری'],['me','👤','من']];
function go(t){tab=t;render();window.scrollTo({top:0,behavior:'smooth'})}
function render(){
  if(!S.people.length&&tab!=='wizard'){startWizard(null);return}
  H.burn=calcBurn();
  $('psw').innerHTML='';
  if(tab==='wizard'){$('tabs').innerHTML='';$('tabs').style.display='none';$('stk').style.visibility='hidden';vxBarShow(0);$('fab').style.display='none';rWizard();return}
  $('tabs').style.display='';$('stk').style.visibility='';vxBarShow(1);
  if(isChild()){$('fab').style.display='none';$('stk').style.visibility='hidden';vxBarShow(0);rChild();return}
  $('fab').style.display='';if(!TABS.some(t=>t[0]===tab)&&tab!=='ask'&&tab!=='aiplan')tab='today';
  $('tabs').innerHTML=TABS.map(t=>`<button class="${t[0]===tab||((tab==='ask'||tab==='aiplan')&&t[0]==='plan')?'on':''}" data-t="${t[0]}"><span>${vxEmo(t[1])}</span>${t[2]}</button>`).join('');
  $('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.t));
  vxStk();
  ({today:rToday,search:rSearch,plan:()=>{rCoach();vxSeg('plan')},aiplan:()=>{rPlan();vxSeg('aiplan')},stats:rStats,me:()=>{rMe();vxMeExtras()},ask:()=>{rAsk();vxSeg('ask')}})[tab]()}
render();
</script>
