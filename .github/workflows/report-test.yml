name: report-test
on:
  push:
    branches: [general-report]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vex_health
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: fonts for tests
        run: |
          mkdir -p tfonts
          curl -sSL -o /tmp/ar.ttf "https://github.com/google/fonts/raw/main/ofl/notosansarabic/NotoSansArabic%5Bwdth,wght%5D.ttf"
          curl -sSL -o /tmp/so.ttf "https://github.com/google/fonts/raw/main/ofl/sora/Sora%5Bwght%5D.ttf"
          for w in Thin ExtraLight Light Regular Medium SemiBold Bold ExtraBold Black; do cp /tmp/ar.ttf tfonts/NotoSansArabic-$w.ttf; cp /tmp/so.ttf tfonts/Sora-$w.ttf; done
          ls -la tfonts | head
          sed -i 's#    - assets/brand/#    - assets/brand/\n    - tfonts/#' pubspec.yaml
      - run: flutter pub get
      - name: test
        run: |
          st=0; flutter test test/report_smoke_test.dart --update-goldens -r expanded > t.txt 2>&1 || st=$?
          echo "exit=$st" >> t.txt
          mkdir -p /tmp/o && cp t.txt /tmp/o/out.txt && cp -r test/goldens /tmp/o/ 2>/dev/null || true
          cd ..
          git config user.name ci && git config user.email ci@example.com
          git checkout --orphan ci-out
          git rm -rq --cached .
          rm -rf o && cp -r /tmp/o o
          git add o && git commit -qm out && git push -f origin ci-out
          exit $st
