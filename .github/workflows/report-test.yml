name: report-test
on:
  push:
    branches: [general-report]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vex_health
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: test
        run: |
          st=0; flutter test test/report_smoke_test.dart -r expanded > t.txt 2>&1 || st=$?
          echo "exit=$st" >> t.txt
          cp t.txt /tmp/t.txt
          cd ..
          git config user.name ci && git config user.email ci@example.com
          git checkout --orphan ci-out
          git rm -rq --cached . 
          cp /tmp/t.txt out.txt
          git add out.txt && git commit -qm out && git push -f origin ci-out
          exit $st
