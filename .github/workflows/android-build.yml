name: android-build
on:
  push:
    branches: [arena-today]
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: build
        working-directory: vex_health
        run: |
          mkdir -p /tmp/o
          st=0
          build() {
            set -e
            flutter create . --platforms=android --org com.vex --project-name vex_health
            python3 tools/setup_native.py
            python3 tools/setup_native.py
            flutter pub get
            flutter build apk --debug
          }
          build > /tmp/o/build.txt 2>&1 || st=$?
          echo "exit=$st" >> /tmp/o/build.txt
          cp android/app/build.gradle.kts android/build.gradle.kts /tmp/o/ 2>/dev/null || true
          exit $st
      - name: publish
        if: always()
        run: |
          cd /tmp/o
          git init -q && git config user.name ci && git config user.email ci@example.com
          git checkout -q -b ci-build && git add -A && git commit -qm out
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-build
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: build
        working-directory: vex_health
        run: |
          mkdir -p /tmp/o
          st=0
          build() {
            set -e
            flutter create . --platforms=ios --org com.vex --project-name vex_health
            flutter pub get
            gem install xcodeproj --no-document >/dev/null 2>&1 || sudo gem install xcodeproj --no-document
            ruby tools/setup_ios.rb
            ruby tools/setup_ios.rb
            flutter build ios --no-codesign --debug
          }
          build > /tmp/o/build.txt 2>&1 || st=$?
          echo "exit=$st" >> /tmp/o/build.txt
          cp ios/Runner/AppDelegate.swift ios/Runner/Info.plist /tmp/o/ 2>/dev/null || true
          cp ios/Runner.xcodeproj/project.pbxproj /tmp/o/ 2>/dev/null || true
          ls -R build/ios/iphoneos 2>/dev/null | grep -i "appex\|\.app" > /tmp/o/products.txt || true
          exit $st
      - name: publish
        if: always()
        run: |
          cd /tmp/o
          git init -q && git config user.name ci && git config user.email ci@example.com
          git checkout -q -b ci-ios && git add -A && git commit -qm out
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-ios
