name: ecg-live-test
on:
  push:
    branches: [ecg-live]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - working-directory: vex_health
        run: flutter pub get
      - name: test
        working-directory: vex_health
        run: |
          mkdir -p /tmp/o
          flutter analyze --no-fatal-infos --no-fatal-warnings > /tmp/o/analyze.txt 2>&1 || true
          st=0; flutter test test/ecg_live_test.dart -r expanded > /tmp/o/out.txt 2>&1 || st=$?
          echo "exit=$st" >> /tmp/o/out.txt
          exit $st
      - name: publish
        if: always()
        run: |
          mkdir -p /tmp/o
          cd /tmp/o
          git init -q
          git config user.name ci && git config user.email ci@example.com
          git checkout -q -b ci-out
          git add -A && git commit -qm out
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-out
