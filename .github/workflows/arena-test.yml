name: arena-test
on:
  push:
    branches: [arena-today]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: fonts for tests
        working-directory: vex_health
        run: |
          mkdir -p tfonts
          pip install fonttools > /tmp/pip.txt 2>&1
          python3 ../.github/workflows/tfonts.py > /tmp/fonts.txt 2>&1
          sed -i 's#    - assets/brand/#    - assets/brand/\n    - tfonts/#' pubspec.yaml
          sudo apt-get install -y ffmpeg > /dev/null 2>&1 || true
      - working-directory: vex_health
        run: flutter pub get
      - name: test
        working-directory: vex_health
        run: |
          mkdir -p /tmp/o
          flutter analyze --no-fatal-infos --no-fatal-warnings > /tmp/o/analyze.txt 2>&1 || true
          st=0; flutter test test/food_ai_test.dart --update-goldens -r expanded > /tmp/o/out.txt 2>&1 || st=$?
          echo "exit=$st" >> /tmp/o/out.txt
          st2=0; flutter test test/report_test.dart -r expanded > /tmp/o/report.txt 2>&1 || st2=$?
          echo "exit=$st2" >> /tmp/o/report.txt
          mkdir -p /tmp/o/food
          cp test/goldens/food/*.png /tmp/o/food/ 2>/dev/null || true
          if [ -d test/goldens/video ]; then
            ls test/goldens/video | wc -l > /tmp/o/frames.txt
            ffmpeg -y -framerate 15 -i test/goldens/video/f_%04d.png -vf "scale=584:-2,format=yuv420p" -c:v libx264 -preset veryfast -crf 21 -movflags +faststart /tmp/o/vex_ai_food_v2.mp4 > /tmp/o/ffmpeg.txt 2>&1 || true
          fi
          exit $st
      - name: publish
        if: always()
        run: |
          mkdir -p /tmp/o
          cd /tmp/o
          git init -q
          git config user.name ci && git config user.email ci@example.com
          git checkout -q -b ci-out
          git add -A && git commit -qm out
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-out
