name: arena-banner-test
on:
  push:
    branches: [arena-banner]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: test
        working-directory: vex_health
        run: |
          flutter pub get > /dev/null
          (flutter analyze --no-fatal-infos --no-fatal-warnings lib/arena lib/home test/arena_banner_test.dart > ../analyze.txt 2>&1; echo "exit=$?" >> ../analyze.txt) || true
          (flutter test test/arena_banner_test.dart > ../test.txt 2>&1; echo "exit=$?" >> ../test.txt) || true
      - name: publish
        run: |
          mkdir /tmp/o && cp analyze.txt test.txt /tmp/o/
          cd /tmp/o && git init -q && git checkout -q -b ci-out
          git -c user.name=ci -c user.email=ci@x add . && git -c user.name=ci -c user.email=ci@x commit -qm out
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-out
